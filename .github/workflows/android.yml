name: Build Android APK

# 官方打包工具 pyside6-android-deploy 只支持 Linux/macOS 主机，
# 所以放到 Ubuntu runner 上构建，本机不需要安装任何 Android 工具链。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构
        required: true
        default: aarch64
        type: choice
        options: [aarch64, x86_64]
      mode:
        description: debug 产出 apk / release 产出 aab
        required: true
        default: debug
        type: choice
        options: [debug, release]
  push:
    tags:
      - 'v*'

env:
  QTPY_VERSION: '6.10.3'
  PYSIDE_SETUP_BRANCH: '6.10'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 放在最前面：脚本若有语法错误，这里几秒内就会失败，
      # 并把 bash -n 的原始报错（含行号）作为注解输出，便于直接定位。
      - name: Check build script syntax
        run: |
          set -uo pipefail
          if ! out=$(bash -n android/build_apk.sh 2>&1); then
            msg="${out//$'\n'/%0A}"
            echo "::error title=bash syntax error::$msg"
            exit 1
          fi
          echo "android/build_apk.sh syntax OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "PySide6==${QTPY_VERSION}" Cython buildozer
          # pyside6-android-deploy 启动时会校验它自带的 requirements-android.txt
          REQ_ANDROID="$(python -c 'import PySide6.scripts, os; print(os.path.join(os.path.dirname(PySide6.scripts.__file__), "requirements-android.txt"))')"
          echo "requirements-android.txt -> $REQ_ANDROID"
          [ -f "$REQ_ANDROID" ] && python -m pip install -r "$REQ_ANDROID" || true
          # 这里必须显式失败，否则缺少命令时会在后面变成难懂的 exit 127
          if ! command -v pyside6-android-deploy >/dev/null; then
            echo "::error::pyside6-android-deploy 未安装"
            exit 1
          fi
          pyside6-android-deploy --help >/dev/null && echo "pyside6-android-deploy OK"

      # Android SDK/NDK 体积很大（数 GB），缓存后后续构建会快很多
      # 注意：官方缓存目录是 ~/.pyside6_android_deploy（下划线）
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.pyside6_android_deploy
          key: pyside6-android-sdk-ndk-${{ env.QTPY_VERSION }}-v3

      - name: Download Android SDK and NDK
        run: |
          set -euo pipefail
          CACHE="$HOME/.pyside6_android_deploy"
          if [ -d "$CACHE" ] && find "$CACHE" -maxdepth 5 -type d -name platform-tools | head -n1 | grep -q .; then
            echo "已从缓存恢复 SDK/NDK，跳过下载"
            exit 0
          fi
          git clone --depth 1 --branch "${PYSIDE_SETUP_BRANCH}" \
            https://code.qt.io/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          REQ="$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"
          [ -f "$REQ" ] && python -m pip install -r "$REQ" || true
          python "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only --skip-update --auto-accept-license
          find "$CACHE" -maxdepth 2 -type d | head -n 20

      - name: Cache Qt for Python Android wheels
        uses: actions/cache@v4
        with:
          path: .android-wheels
          key: pyside6-android-wheels-${{ env.QTPY_VERSION }}-${{ inputs.arch || 'aarch64' }}

      - name: Build APK
        env:
          ANDROID_ARCH: ${{ inputs.arch || 'aarch64' }}
          BUILDOZER_MODE: ${{ inputs.mode || 'debug' }}
        run: |
          set -euo pipefail
          # 仓库名就叫 CloudFlareScan，检出后文件直接在 workspace 根目录
          echo "workspace: $GITHUB_WORKSPACE"
          ls -la
          echo "--- android/ ---"
          ls -la android
          echo "--- SDK/NDK 缓存 ---"
          ls "$HOME/.pyside6_android_deploy" || true
          bash android/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-android-${{ inputs.arch || 'aarch64' }}
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
          retention-days: 30
